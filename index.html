<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>World Clock</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>

      <select>
        <option value="">Select a City..</option>
        <option value="">United Kingdom</option>
        <option value="">Cyprus</option>
        <option value="">Egypt</option>
        <option value="">Australia</option>
      </select>

      <div class="city" id="london">
        <div>
          <h2>London 🇬🇧</h2>
          <div class="date">September 10th 2026</div>
        </div>

        <div class="time">00:00:00 <small>AM</small></div>
      </div>

      <div class="city" id="girne">
        <div>
          <h2>Girne 🇹🇷</h2>
          <div class="date">September 10th 2026</div>
        </div>

        <div class="time">00:00:00 <small>AM</small></div>
      </div>
      <div class="city" id="luxor">
        <div>
          <h2>Luxor 🇪🇬</h2>
          <div class="date">September 10th 2026</div>
        </div>

        <div class="time">00:00:00 <small>AM</small></div>
      </div>

      <div class="city" id="perth">
        <div>
          <h2>Perth 🇦🇺</h2>
          <div class="date">September 10th 2026</div>
        </div>

        <div class="time">00:00:00 <small>AM</small></div>
      </div>
    </div>
    <footer>
      This project was coded by<strong> 👩🏻‍💻 Sirin Kiani </strong>

      hosted on
      <a href="https://app.netlify.com/teams/shiz2633/projects" target="_blank"
        >Netlify</a
      >
    </footer>
    <script src="javascript/index.js"></script>
  </body>
</html>
