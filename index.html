<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>World Clock</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>

      <select id="city-select">
        <option value="">Select a City..</option>
        <option value="current">My current location📍</option>
        <option value="Europe/London">London</option>
        <option value="Europe/Nicosia">Girne</option>
        <option value="Africa/Cairo">Luxor</option>
        <option value="Australia/Perth">Perth</option>
      </select>

      <div id="city-container">
        <div class="city" id="london">
          <div>
            <h2>London 🇬🇧</h2>
            <div class="date">September 10th 2026</div>
          </div>

          <div class="time">00:00:00 <small>AM</small></div>
        </div>

        <div class="city" id="girne">
          <div>
            <h2>Girne 🇹🇷</h2>
            <div class="date">September 10th 2026</div>
          </div>

          <div class="time">00:00:00 <small>AM</small></div>
        </div>
        <div class="city" id="luxor">
          <div>
            <h2>Luxor 🇪🇬</h2>
            <div class="date">September 10th 2026</div>
          </div>

          <div class="time">00:00:00 <small>AM</small></div>
        </div>

        <div class="city" id="perth">
          <div>
            <h2>Perth 🇦🇺</h2>
            <div class="date">September 10th 2026</div>
          </div>

          <div class="time">00:00:00 <small>AM</small></div>
        </div>
      </div>
    </div>
    <footer>
      This project was coded by<strong> 👩🏻‍💻 Sirin Kiani </strong>
      <a href="https://github.com/shiz2633" target="_blank">GitHub</a>
      hosted on
      <a href="https://app.netlify.com/teams/shiz2633/projects" target="_blank"
        >Netlify</a
      >
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment-timezone@0.5.47/builds/moment-timezone-with-data.min.js"></script>
    <script src="javascript/index.js"></script>
  </body>
</html>
